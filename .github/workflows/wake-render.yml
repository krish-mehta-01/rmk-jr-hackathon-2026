# Render's free plan sleeps when idle. On 10-14 Nov and the hackathon day (15 Nov 2026) this opens the
# site every hour from about 6 AM to 9 PM IST. GitHub runs schedules late or skips them at busy times,
# so hourly runs make sure the site is woken within the hour; the server's own keep-awake
# (backend/server.js) then keeps it up between runs.
name: Wake Render service

on:
  schedule:
    - cron: '20 0-15 10-15 11 *'   # every hour 05:50-20:50 IST, 10-15 Nov (15 Nov hackathon day)

  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping until the server answers
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(TZ=Asia/Kolkata date +%Y)" != "2026" ]; then
            echo "Outside the 2026 hackathon window, skipping"; exit 0
          fi
          for i in $(seq 1 12); do
            if curl -fsS --max-time 90 https://rmkjuniorhackathon2026.onrender.com/api/health; then
              echo " - awake"; exit 0
            fi
            sleep 10
          done
          echo "Server did not answer"; exit 1
