# Render's free plan sleeps overnight; this opens the site each morning so the
# server's own daytime keep-awake (backend/server.js) takes over from there.
name: Wake Render service

on:
  schedule:
    - cron: '40 0 * * *'   # 06:10 IST daily (GitHub may run it a few minutes late)
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping until the server answers
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 90 https://rmk-jr-hackathon-2026.onrender.com/api/health; then
              echo " - awake"; exit 0
            fi
            sleep 10
          done
          echo "Server did not answer"; exit 1
